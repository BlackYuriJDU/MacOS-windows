name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            plat: windows-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            plat: windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Build do frontend (gera dist/ que o Tauri embute)
        run: npm run build

      - name: Gerar ícones
        shell: pwsh
        run: ./scripts/make-icons.ps1

      - name: Build (Tauri)
        run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - uses: actions/upload-artifact@v4
        with:
          name: macos-windows-${{ matrix.target }}
          path: |
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/msi/*.sig
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/nsis/*.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Montar latest.json (manifesto do updater)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $ver = $tag -replace '^v',''
          $platforms = [ordered]@{}
          Get-ChildItem artifacts -Directory | ForEach-Object {
            $dir = $_.FullName
            $exe = Get-ChildItem $dir -Recurse -Filter '*-setup.exe' | Select-Object -First 1
            if (-not $exe) { return }
            $plat = if ($_.Name -like '*aarch64*') { 'windows-aarch64' } else { 'windows-x86_64' }
            $sig = (Get-Content "$($exe.FullName).sig" -Raw).Trim()
            $platforms[$plat] = [ordered]@{
              signature = $sig
              url = "https://github.com/BlackYuriJDU/MacOS-windows/releases/download/$tag/$($exe.Name)"
            }
          }
          $manifest = [ordered]@{
            version = $ver
            notes = "Mac OS $ver"
            pub_date = (Get-Date -Format o)
            platforms = $platforms
          }
          $manifest | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 latest.json
          Get-Content latest.json

      - name: Publicar Release com instaladores + latest.json
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.msi
            artifacts/**/*.sig
            artifacts/**/*-setup.exe
            latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
