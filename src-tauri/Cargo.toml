[package]
name = "macos-windows"
version = "0.3.0"
description = "Ambiente de trabalho estilo macOS para Windows — projeto de fã, sem afiliação com a Apple"
authors = ["BlackYuriJDU"]
license = "MIT"
edition = "2021"

[lib]
name = "macos_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Ole",
    "Win32_Foundation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
