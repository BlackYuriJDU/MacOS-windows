[package]
name = "macos-windows"
version = "0.1.0"
description = "Ambiente de trabalho estilo macOS para Windows — projeto de fã, sem afiliação com a Apple"
authors = ["BlackYuriJDU"]
license = "MIT"
edition = "2021"

[lib]
name = "macos_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
